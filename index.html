<title>Cadence</title>
<style>
/* Cadence v14 : agenda simple. Une colonne de 720 px max, listes groupées, navigation fixe à 4 onglets. */
:root {
  --bg: #F2F3F8; --surface: #FFFFFF; --soft: #E9EBF4; --ink: #14162B; --muted: #626882; --line: #E0E3EE;
  --acc-l: #5B4BFF; --acc-d: #8F86FF;
  --accent: var(--acc-l); --on-accent: #FFFFFF;
  --accent-soft: color-mix(in srgb, var(--accent) 13%, var(--surface));
  --ok: #0C9A60; --ok-soft: #DCF4E8; --bad: #D92D4B; --warn: #B45309;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Instrument Sans', 'Segoe UI', system-ui, sans-serif;
  --font-clock: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D0F1C; --surface: #171A2C; --soft: #23263C; --ink: #ECEEFA; --muted: #9DA2BD; --line: #2A2E47;
    --accent: var(--acc-d); --on-accent: #0D0F1C; --ok: #3DD598; --ok-soft: #173528; --bad: #FF8A9B; --warn: #F0B45A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D0F1C; --surface: #171A2C; --soft: #23263C; --ink: #ECEEFA; --muted: #9DA2BD; --line: #2A2E47;
  --accent: var(--acc-d); --on-accent: #0D0F1C; --ok: #3DD598; --ok-soft: #173528; --bad: #FF8A9B; --warn: #F0B45A; color-scheme: dark;
}
* { box-sizing: border-box; }
*::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.45;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px));
}
body.noscroll { overflow: hidden; }
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 18px; }
h1, h2, h3, p { margin: 0; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 30px; letter-spacing: -0.03em; line-height: 1.05; }
h2 { font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.02em; line-height: 1.15; }
h3 { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: -0.01em; line-height: 1.25; }
.sub { color: var(--muted); }
.hint { color: var(--muted); font-size: 13.5px; }
.err { color: var(--bad); font-size: 14px; }
.tnum { font-variant-numeric: tabular-nums; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
button { font: inherit; color: inherit; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type="text"], input[type="email"], input[type="password"], input[type="time"], input[type="date"], input[type="search"], input[type="url"], select, textarea {
  font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-height: 48px; padding: 0 14px; width: 100%; min-width: 0;
}
textarea { padding: 12px 14px; min-height: 90px; resize: vertical; }
label.f { display: grid; gap: 6px; font-size: 14px; font-weight: 600; color: var(--muted); min-width: 0; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; }

/* boutons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 14px; border: 0; background: var(--soft); color: var(--ink); font-weight: 600; font-size: 15px; cursor: pointer; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.ghost { background: none; color: var(--accent); padding: 0 8px; }
.btn.danger { color: var(--bad); }
.btn.armed { background: var(--bad); color: #fff; }
.btn.big { width: 100%; min-height: 54px; font-size: 16.5px; border-radius: 16px; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 12px; }
.btn[disabled] { opacity: .55; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.icb { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; flex: none; color: var(--ink); }
.icb svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* en-tête */
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; padding-top: 4px; }
.top .date { color: var(--muted); font-size: 14.5px; margin-bottom: 4px; }
.top .date::first-letter { text-transform: uppercase; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; font-size: 16px; flex: none; border: 0; cursor: pointer; }
.avatar.big { width: 72px; height: 72px; font-size: 26px; cursor: default; }

/* sélecteur de vue */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--soft); border-radius: 16px; padding: 4px; }
.seg button { min-height: 42px; border: 0; border-radius: 12px; background: none; font-weight: 600; font-size: 15px; color: var(--muted); cursor: pointer; padding: 0 6px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(20, 22, 43, .12); }

/* navigation de période */
.pnav { display: grid; grid-template-columns: 44px minmax(0, 1fr) 44px; align-items: center; gap: 10px; }
.pnav .pl { text-align: center; min-width: 0; }
.pnav .pl h2 { font-size: 22px; }
.pnav .pl h2::first-letter { text-transform: uppercase; }
.pnav .pl small { display: block; color: var(--muted); font-size: 13.5px; }
.today-btn { justify-self: center; }

/* listes groupées */
.blk { display: grid; gap: 10px; }
.sh { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.sh .cnt { color: var(--muted); font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 6px 8px 6px 12px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .txt { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 8px 0; cursor: pointer; display: grid; gap: 1px; overflow-wrap: anywhere; }
.row .txt span { font-size: 16px; }
.row .txt small { color: var(--muted); font-size: 13px; }
.row .tm { font-size: 14px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; flex: none; min-width: 44px; }
.row.done .txt span { text-decoration: line-through; color: var(--muted); }
.row .x { width: 40px; height: 40px; border: 0; background: none; color: var(--muted); font-size: 22px; border-radius: 10px; cursor: pointer; flex: none; }
.empty { padding: 14px; color: var(--muted); font-size: 14.5px; }
.ck { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; flex: none; padding: 0; color: transparent; }
.ck svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.ck[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.add { display: flex; gap: 8px; align-items: center; padding: 8px; border-top: 1px solid var(--line); }
.list .add:first-child { border-top: 0; }
.add input[type="text"] { border: 0; background: none; min-height: 42px; padding: 0 6px; }
.add input[type="time"] { width: 104px; flex: none; min-height: 40px; padding: 0 8px; font-size: 14px; border-radius: 12px; background: var(--soft); border: 0; }
.add .btn { flex: none; }
.addplus { width: 40px; height: 40px; border-radius: 12px; border: 0; background: var(--accent); color: var(--on-accent); font-size: 24px; line-height: 1; cursor: pointer; flex: none; }
.bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* semaine */
.wk { display: grid; gap: 10px; }
.wday { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: start; }
.wnum { display: grid; justify-items: center; gap: 0; padding-top: 6px; border: 0; background: none; cursor: pointer; color: var(--ink); }
.wnum b { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.wnum span { font-size: 13px; color: var(--muted); font-weight: 600; }
.wday.today .wnum b, .wday.today .wnum span { color: var(--accent); }
.wday .list { min-height: 54px; }
.wday.today .list { border-color: var(--accent); }
.addline { width: 100%; text-align: left; border: 0; border-top: 1px solid var(--line); background: none; color: var(--accent); font-weight: 600; font-size: 14.5px; min-height: 44px; padding: 0 14px; cursor: pointer; }
.list .addline:first-child { border-top: 0; }

/* mois */
.mgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.mgrid .dl { text-align: center; font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 4px 0; }
.mc { aspect-ratio: 1 / 1.05; min-height: 44px; border-radius: 12px; border: 1px solid transparent; background: var(--surface); display: grid; grid-template-rows: auto 1fr; justify-items: center; padding: 5px 2px 4px; cursor: pointer; color: var(--ink); }
.mc.out { background: none; color: var(--muted); opacity: .45; }
.mc b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mc .dots { display: flex; gap: 3px; align-self: end; height: 6px; }
.mc .dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
.mc .dots i.d { background: var(--line); }
.mc.today b { color: var(--accent); font-weight: 800; }
.mc.today { border-color: var(--accent); }
.mc[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.mc[aria-pressed="true"] b { color: var(--on-accent); }
.mc[aria-pressed="true"] .dots i { background: var(--on-accent); }
.mc[aria-pressed="true"] .dots i.d { opacity: .5; }

/* année */
.yr { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.yt { border: 1px solid var(--line); background: var(--surface); border-radius: 16px; padding: 12px; display: grid; gap: 6px; text-align: left; cursor: pointer; min-width: 0; }
.yt b { font-family: var(--font-display); font-size: 17px; font-weight: 700; }
.yt b::first-letter { text-transform: uppercase; }
.yt small { color: var(--muted); font-size: 12.5px; }
.yt.now { border-color: var(--accent); }
.yt.now b { color: var(--accent); }

/* objectifs */
.gsec .sh h3 small { display: block; font-family: var(--font-body); font-weight: 500; font-size: 13.5px; color: var(--muted); letter-spacing: 0; }

/* pomodoro */
.tmr { border-radius: 22px; border: 1px solid var(--line); background: var(--surface); padding: 16px; display: grid; gap: 12px; }
.tmr.run { background: var(--acc-l); border-color: var(--acc-l); color: #fff; }
.tmr.brk { background: #0C8A57; border-color: #0C8A57; color: #fff; }
.tmr .th { display: flex; align-items: center; gap: 10px; }
.tmr .th input { flex: 1; font-family: var(--font-display); font-weight: 700; font-size: 18px; border: 0; background: none; padding: 0 2px; min-height: 36px; color: inherit; }
.tmr .ph { font-size: 13.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: var(--soft); color: var(--muted); flex: none; }
.tmr.run .ph, .tmr.brk .ph { background: rgba(255, 255, 255, .2); color: #fff; }
.clock { font-family: var(--font-clock); font-variant-numeric: tabular-nums; font-size: 56px; font-weight: 500; letter-spacing: -0.02em; line-height: 1; text-align: center; padding: 6px 0 2px; }
.tmr .bar { background: var(--soft); }
.tmr.run .bar, .tmr.brk .bar { background: rgba(255, 255, 255, .25); }
.tmr.run .bar i, .tmr.brk .bar i { background: #fff; }
.tmr .btns { justify-content: center; }
.tmr.run .btn, .tmr.brk .btn { background: rgba(255, 255, 255, .18); color: #fff; }
.tmr.run .btn.primary, .tmr.brk .btn.primary { background: #fff; color: #2B1FB8; }
.tmr.brk .btn.primary { color: #0B6B44; }
.tset { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stp { display: flex; align-items: center; justify-content: space-between; gap: 4px; background: var(--soft); border-radius: 14px; padding: 4px; }
.tmr.run .stp, .tmr.brk .stp { background: rgba(255, 255, 255, .14); }
.stp span { font-size: 13.5px; font-weight: 600; text-align: center; line-height: 1.2; }
.stp span small { display: block; font-weight: 500; opacity: .75; font-size: 12px; }
.stp button { width: 36px; height: 36px; border-radius: 10px; border: 0; background: var(--surface); color: inherit; font-size: 20px; cursor: pointer; flex: none; }
.tmr.run .stp button, .tmr.brk .stp button { background: rgba(255, 255, 255, .2); }
.tmr .tf { text-align: center; font-size: 13.5px; opacity: .85; }

/* profil */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.me { display: flex; align-items: center; gap: 14px; }
.sw { display: flex; gap: 10px; flex-wrap: wrap; }
.sw button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); cursor: pointer; padding: 0; }
.sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--ink); }
.tg { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; }
.switch { width: 52px; height: 30px; border-radius: 15px; border: 0; background: var(--line); position: relative; cursor: pointer; flex: none; padding: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left .15s; box-shadow: 0 1px 2px rgba(0, 0, 0, .2); }
.switch[aria-pressed="true"] { background: var(--accent); }
.switch[aria-pressed="true"]::after { left: 25px; }
.ver { text-align: center; color: var(--muted); font-size: 13px; }

/* accueil */
.ob { display: grid; gap: 18px; padding-top: 8px; }
.ob .lead { font-size: 16.5px; color: var(--muted); }
.ob h1 { font-size: 36px; }
.steps { display: flex; gap: 6px; }
.steps i { height: 4px; flex: 1; border-radius: 2px; background: var(--line); }
.steps i.on { background: var(--accent); }

/* feuille, toast, nav */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(13, 15, 28, .45); border: 0; padding: 0; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 720px; margin: 0 auto; max-height: 92vh; overflow-y: auto; background: var(--surface); border-radius: 24px 24px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: grid; gap: 14px; box-shadow: 0 -10px 40px rgba(13, 15, 28, .3); }
.sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); justify-self: center; }
.sheet form { display: grid; gap: 14px; }
.toast { position: fixed; z-index: 40; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); width: min(calc(100% - 28px), 560px); background: #14162B; color: #fff; border-radius: 16px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 8px; font-size: 14.5px; box-shadow: 0 12px 30px rgba(13, 15, 28, .35); }
.toast span { flex: 1; min-width: 0; }
.toast button { border: 0; background: rgba(255, 255, 255, .16); color: #fff; font-weight: 700; font-size: 14px; min-height: 38px; padding: 0 14px; border-radius: 10px; cursor: pointer; flex: none; }
.note { background: var(--accent-soft); border-radius: 16px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 14.5px; }
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line); display: flex; padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.nav button { flex: 1; min-width: 0; display: grid; justify-items: center; gap: 3px; min-height: 56px; padding: 6px 0 4px; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 600; cursor: pointer; position: relative; isolation: isolate; }
.nav svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.nav button[aria-current="page"] { color: var(--accent); }
.nav button[aria-current="page"]::before { content: ""; position: absolute; top: 3px; left: 50%; transform: translateX(-50%); width: 58px; height: 32px; border-radius: 16px; background: var(--accent-soft); z-index: -1; }
.nav .run-dot { position: absolute; top: 6px; right: calc(50% - 22px); width: 9px; height: 9px; border-radius: 50%; background: #F0512D; }
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: up .22s ease-out; }
  @keyframes up { from { opacity: 0; transform: translateX(-50%) translateY(8px); } }
  .ck:active, .btn:active, .mc:active { transform: scale(.96); }
}
@media (min-width: 560px) { .yr { grid-template-columns: repeat(4, minmax(0, 1fr)); } }

/* ===== v15 ===== */
:root { --on-accent: var(--on-acc-l, #FFFFFF); }
:root[data-size="l"] body { zoom: 1.1; }
:root[data-size="xl"] body { zoom: 1.22; }
.tmr.run { color: var(--on-acc-l, #fff); }
body.gate { padding-bottom: 40px; }
.auth { display: grid; gap: 18px; padding-top: 10px; }
.auth h1 { font-size: 34px; }
.auth .lead { font-size: 16.5px; color: var(--muted); }
.auth.loading { min-height: 60vh; align-content: center; justify-items: center; text-align: center; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -0.02em; }
.logo { width: 40px; height: 40px; border-radius: 12px; background: var(--acc-l); color: var(--on-acc-l, #fff); display: grid; place-items: center; }
.logo svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

}

/* objectifs */

/* Pomodoro */

input[type="number"] { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; min-height: 48px; padding: 0 14px; width: 100%; min-width: 0; }

@media (prefers-reduced-motion: no-preference) { .wsd:active, .lcard:active, .nt:active, .dream:active { transform: scale(.97); } .mic.on { animation: micp 1.2s ease-in-out infinite; } @keyframes micp { 50% { box-shadow: 0 0 0 8px color-mix(in srgb, var(--bad) 15%, transparent); } } }

/* ===== v21 ===== */
/* budget */

/* agenda partagé */

/* ===== v22 : Ensemble ===== */
.nav button span { font-size: 10.5px; }

.cols3 input, .cols3 select, .cols3 .btn { min-height: 44px; font-size: 14px; padding: 0 8px; }

/* ===== v26 : design sobre (type Apple) ===== */
:root {
  --bg: #F2F2F7; --surface: #FFFFFF; --soft: #EBEBF0; --ink: #1C1C1E; --muted: #6C6C70; --line: #E3E3E8;
  --ok: #248A3D; --ok-soft: #E3F4E7; --bad: #D70015; --warn: #B25000;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-clock: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #000000; --surface: #1C1C1E; --soft: #2C2C2E; --ink: #F2F2F7; --muted: #98989F; --line: #2E2E32; --ok: #30D158; --ok-soft: #173520; --bad: #FF453A; --warn: #FF9F0A; --on-accent: #000000; }
}
:root[data-theme="dark"] { --bg: #000000; --surface: #1C1C1E; --soft: #2C2C2E; --ink: #F2F2F7; --muted: #98989F; --line: #2E2E32; --ok: #30D158; --ok-soft: #173520; --bad: #FF453A; --warn: #FF9F0A; --on-accent: #000000; }
body { font-size: 16px; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; }
h1 { font-weight: 700; font-size: 32px; letter-spacing: -0.025em; }
h2 { font-weight: 700; font-size: 21px; letter-spacing: -0.02em; }
h3 { font-weight: 600; font-size: 17px; letter-spacing: -0.015em; }
.pg { gap: 22px; }
.sh h3 { font-size: 19px; font-weight: 700; }
.sh .cnt { font-weight: 500; }

/* icônes fines */
.ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; display: inline-block; vertical-align: -0.22em; }
.he, .le, .ce, .we, .spe, .spbig, .lkic, .pe, .npin { display: inline-grid; place-items: center; color: var(--accent); font-size: 0 !important; line-height: 0; }
.row .he, .habrow .he, .hst .he { width: 30px; }
.row .he .ic, .hst .he .ic { width: 20px; height: 20px; }
.hab .he .ic { width: 18px; height: 18px; }
.lcard .le .ic, .lhead .le .ic { width: 24px; height: 24px; }
.spe .ic { width: 30px; height: 30px; } .spbig .ic, .lkic .ic { width: 44px; height: 44px; stroke-width: 1.4; }
.chip .ic { width: 16px; height: 16px; }
.chip.emo .ic { width: 20px; height: 20px; }
.ait { display: flex; align-items: center; gap: 6px; } .ait .ic { width: 16px; height: 16px; color: var(--accent); }
.mbl span { display: inline-flex; align-items: center; gap: 6px; } .mbl .ic { width: 16px; height: 16px; color: var(--accent); }
.rp .ic, .rm .ic { width: 13px; height: 13px; vertical-align: -0.15em; }

/* surfaces plates */
.card, .list, .tile, .tmr, .lcard, .nt, .cdc, .wsd, .yt, .bdg, .slw { border-color: transparent; border-radius: var(--r); }
.card { padding: 16px; }
.list { border-radius: var(--r); }
.row { border-top-color: var(--line); }
.mc { border-radius: 10px; }
input[type="text"], input[type="email"], input[type="password"], input[type="time"], input[type="date"], input[type="search"], input[type="number"], input[type="url"], select, textarea { border-radius: 12px; border-color: var(--line); background: var(--surface); }
.btn { border-radius: 12px; font-weight: 600; }
.btn.big { border-radius: 14px; }
.btn.sm { border-radius: 10px; }
.chip { border-radius: 999px; font-weight: 500; background: var(--surface); border-color: var(--line); }
.seg { border-radius: 10px; padding: 2px; background: var(--soft); }
.seg button { border-radius: 8px; min-height: 36px; font-size: 14px; font-weight: 600; }
.seg button[aria-pressed="true"] { box-shadow: 0 1px 2px rgba(0, 0, 0, .08), 0 0 0 .5px rgba(0, 0, 0, .04); }
.ck { width: 26px; height: 26px; border-width: 1.5px; border-color: color-mix(in srgb, var(--muted) 55%, transparent); }
.ck svg { width: 14px; height: 14px; stroke-width: 2.6; }
.addplus { border-radius: 10px; font-size: 22px; font-weight: 400; }
.star { color: var(--accent); }
.star .ic { width: 14px; height: 14px; }
.chip.prio { gap: 6px; }
.chip.prio[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.pc.prio { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* en-tête et barre du bas */
.top h1 { font-size: 32px; }
.avatar { width: 38px; height: 38px; font-family: var(--font-body); font-weight: 600; font-size: 15px; }
.nav { background: color-mix(in srgb, var(--surface) 86%, transparent); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--line); padding-top: 4px; padding-left: max(2px, env(safe-area-inset-left, 0px)); padding-right: max(2px, env(safe-area-inset-right, 0px)); }
.nav button { min-height: 52px; gap: 2px; font-weight: 500; }
.nav button[aria-current="page"]::before { display: none; }
.nav svg { width: 23px; height: 23px; stroke-width: 1.6; }
.nav button span { font-size: 10px; letter-spacing: 0; }
.nav button[aria-current="page"] svg { stroke-width: 2; }
.fab { width: 56px; height: 56px; background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 18px -6px rgba(0, 0, 0, .35); }

/* carte du jour (sans dégradé) */
.hero2 { background: var(--surface); color: var(--ink); border-radius: var(--r); box-shadow: none; padding: 16px; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; }
.hero2::after { display: none; }
.hero2.win { background: var(--surface); color: var(--ink); }
.hero2 .rbox { width: 64px; height: 64px; }
.hero2 .rbox b { font-family: var(--font-body); font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums; }
.ring .r0 { stroke: var(--soft); stroke-width: 7; }
.ring .r1 { stroke: var(--accent); stroke-width: 7; }
.hero2.win .ring .r1 { stroke: var(--ok); }
.hero2 h2 { font-size: 20px; }
.hero2 p { color: var(--muted); opacity: 1; font-size: 14.5px; }
.hero2 .nxt { display: flex; align-items: center; gap: 8px; background: var(--soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; font-weight: 500; }
.hero2 .nxt span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hero2 .nxt b { color: var(--accent); font-weight: 600; font-size: 13.5px; white-space: nowrap; }
.hero2 .nxt .ic { color: var(--accent); width: 18px; height: 18px; }
.hb { background: var(--accent); color: var(--on-accent); border-radius: 12px; min-height: 46px; line-height: 46px; font-weight: 600; }
.hero2.win .hb { color: var(--on-accent); }

/* Aujourd’hui */
.carry { background: var(--surface); border-color: transparent; box-shadow: inset 3px 0 0 var(--warn); }
.carry .sh h3 { color: var(--warn); font-size: 17px; }
.planbtn { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 0 16px; border: 0; border-radius: var(--r); background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; text-align: left; }
.planbtn span { flex: 1; }
.planbtn .ic { color: var(--accent); } .planbtn .ic.go { color: var(--muted); width: 18px; height: 18px; }
.intent { gap: 10px; background: var(--surface); border-radius: var(--r); font-weight: 500; }
.intent .ic { color: var(--accent); }
.wx, .wxadd { display: flex; align-items: center; gap: 10px; min-height: 54px; padding: 0 16px; }
.wx .we .ic { width: 24px; height: 24px; }
.wx .wt { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.wx .wl { flex: 1; min-width: 0; color: var(--ink); font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wx small { color: var(--muted); font-size: 13.5px; }
.wxadd .ic { color: var(--accent); }
.wstrip { gap: 4px; }
.wsd { background: var(--surface); padding: 7px 0 6px; border-radius: 12px; }
.wsd b { font-family: var(--font-body); font-size: 17px; font-weight: 600; }
.wsd .dots i.bdd { background: var(--muted); }
.wsd.all:not(.now) { box-shadow: inset 0 0 0 1.5px var(--ok); }
.cdc { gap: 2px; } .cdc .ce .ic { width: 20px; height: 20px; } .cdc.bd small { color: var(--muted); }
.bdl { display: flex; align-items: center; gap: 8px; background: var(--surface); font-weight: 500; }
.bdl .ic { color: var(--accent); }
.qline { text-align: center; color: var(--muted); font-size: 14px; padding: 4px 12px 8px; }
.hab { border-color: transparent; background: var(--surface); font-weight: 500; }
.hab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.hab[aria-pressed="true"] .he { color: var(--on-accent); }
.hab[aria-pressed="true"] small { color: inherit; opacity: .8; }
.habempty { background: var(--surface); }
.hdots i.on { background: var(--accent); }
.eve, .review, .news { background: var(--surface); border-color: transparent; }
.load .ic { width: 14px; height: 14px; }

/* plan du matin */
.pick .pstar { color: var(--line); }
.pick .pstar .ic { width: 20px; height: 20px; }
.pick[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 8%, var(--surface)); }
.pick[aria-pressed="true"] .pstar { color: var(--accent); }
.pick[aria-pressed="true"] .pstar .ic { fill: currentColor; }
.tl { border-left-color: var(--line); }

/* Pomodoro sobre : grand chiffre + anneau fin */
.tmr.run, .tmr.brk { background: var(--surface); border-color: transparent; color: var(--ink); }
.tmr.run .ph, .tmr.brk .ph { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); }
.tmr.brk .ph { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); color: var(--ok); }
.tring .t0 { stroke: var(--soft); stroke-width: 4; }
.tring .t1 { stroke: var(--accent); stroke-width: 4; }
.tmr.run .tring .t0, .tmr.brk .tring .t0 { stroke: var(--soft); }

    if (document.hidden) { if (lsGet(CD) === '1' && !sync.conflict) { clearTimeout(pushT); cloudPush(); } }
    else if (Date.now() - lastPull > 20000) cloudSync();
  });
  window.addEventListener('online', function () { if (auth && cloudOn) cloudSync(); });


  /* ---------- nouvelle version ---------- */
  var updVer = 0, updT = 0;
  function updCheck() {
    try {
      if (navigator.onLine === false || Date.now() - updT < 60000) return; updT = Date.now();
      fetch(location.pathname + '?chk=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).then(function (tx) {
        var m = /var APP_VER = (\d+)/.exec(tx || '');
        if (m && +m[1] > APP_VER && +m[1] !== updVer) { updVer = +m[1]; if (!editing() && !sheet) render(); }
      }).catch(function () {});
    } catch (e) {}
  }
  function updBanner() { return updVer ? '<div class="note"><span>Une nouvelle version de Cadence est disponible.</span><button class="btn sm primary" data-act="updnow">Mettre à jour</button></div>' : ''; }
  function updNow() {
    function go() { location.replace(location.pathname + '?v=' + updVer); }
    try {
      var p = [];
      if (window.caches) p.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) p.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
      Promise.all(p).then(go, go);
    } catch (e) { go(); }
  }

  try { if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) {
    navigator.serviceWorker.register('sw.js').then(function (r) { swReg = r; }).catch(function () {});
    navigator.serviceWorker.ready.then(function (r) { swReg = r; }).catch(function () {});
  } } catch (e) {}

  (function () {
    try {
      var q = new URLSearchParams(location.search), jn = q.get('join'), tb = q.get('tab');
      if (jn && /^[0-9a-f-]{36}~[0-9a-f]{32}$/.test(jn)) localStorage.setItem('cadence.join', jn);
      if (tb && ['today', 'agenda', 'space', 'notes', 'budget', 'goals', 'pomo'].indexOf(tb) >= 0) tab = tb;
      if (q.get('add') === '1') setTimeout(function () { if (S.profile.done && !sheet) { sheet = { k: 'quick', err: '' }; render(); focusAdd('#q-text'); } }, 400);
      if (jn || tb || q.get('add')) history.replaceState(null, '', location.pathname);
    } catch (e) {}
    try { if (navigator.serviceWorker) navigator.serviceWorker.addEventListener('message', function (ev) { if (ev.data && ev.data.cadence === 'sync' && auth && cloudOn) { lastPull = 0; cloudSync(); } }); } catch (e) {}
  })();
  applyTheme();
  render();
  cloudBoot();
  if (isLocked()) setTimeout(function () { lockBio(true); }, 400);
  wxLoad();
  setTimeout(function () { maybePlan(); }, 700);
  setInterval(function () { wxLoad(); if (sheet && sheet.k === 'slist' && auth && !document.hidden && !editing()) slFetch(); if (tab === 'space' && auth && !document.hidden && !editing() && !rtLive()) spFetch(true); }, 15000);
  setInterval(function () { var ck = document.getElementById('clk'); if (ck && ck.textContent !== nowHM()) ck.textContent = nowHM(); timerLoop(); remCheck(); if (todayISO() !== lastDay) { var was = lastDay; lastDay = todayISO(); if (cur === was) cur = lastDay; if (!editing() && !sheet) render(); maybePlan(); pushSync(false); } }, 1000);
  
})();
